name: Trigger GitHub Pages deployment

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
